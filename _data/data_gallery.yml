- title: "Gender norms and joint household labor choices"
  description: 'Early stage exploration of US household labor data. THe goal is to understand why there is a persistent gap in the time spent working (and subsequently earned income) between men and women. This gap seems to experience a kink around the 80th percentile where women slow or stop working. These individuals, sometimes known as tradwives, seem to only exist when the household is unconstrained. Further investigation is needed to test whether, when households jointly optimize their decisions to work outside the home, there is a male gender norm - such that the household gains utility from a male spouse working more than the female spouse.'
