- title: "Gender norms and joint household labor choices"
  description: 'Analysis of the income elasticity and potential bunching effects of the breadwinner norm, documented by Bertrand et al (2015). I study the gap in both labor hours and income between heterosexual married households. Early analysis suggests when household income is no longer a binding constraint, there are significant reductions of female work hours.'
  featured:
    image_path: /images/data-female-lab/working-share-women-quintile.png
    title: "Share of employed female spouses"
    caption: "Share of females in married couple households who work by income quintile over time"
    alt: "Share of females in married couple households who work, by income quintile, over time"
  items:
    - image_path: /images/data-female-lab/dual-earner-share-year-quintile.png
      title: "Earnings share by household type"
      caption: " ACS household composition and share of total households by quintile."
      alt: "US ACS data on household composition"
    - image_path: /images/data-female-lab/flfpr-by-county-votespread-pres-election-years.png
      title: "Female labor force participation rate (LFPR)"
      caption: "For previous three presidential years, I plot female LFPR against log(median household income) at the county level."
      alt: "Fitted line shows the relationship between log(median household income) and female LFPR. Dotted lines disaggregate top and bottom quintile."
    - image_path: /images/data-female-lab/flfpr-by-county-color.png
      title: "Change in female LFPR (2012-2022)"
      caption: "Change in female labor force participation by log(median household income). Color indicates the vote margin in 2020 presidential election for the county."
